schema_version = 1
profile_name = "m1_review_noisy_off"

[simulation]
dt = 1.0
precision = "f64"
warmup_ticks = 4
outcomes_per_lifetime = 16
reset_policy = "birth_only"
feedback_order = "before_neural_transition"

[environment]
kind = "mixed_continual"
cue_count = 2
cue_encoding = "one_hot"
stable_fraction = 0.5
feedback_noise_values = [0.2]
volatile_hazard_values = [0.2]
hazard_clock = "cue_exposure"
quiet_ticks = [0, 4]
cue_ticks = 8
memory_gap_ticks = [0, 3]
response_ticks = 4
reward_delay_ticks = [1, 5]
feedback_ticks = 1
max_pending_choices = 1

[actor]
neuron_count = 16
motor_neurons_per_action = 2
edge_probability = 0.25
self_edges = false
recurrent_gain = 0.8
input_scale = 0.3
tau_h = 5.0
tau_a = 100.0
adaptation_strength = 0.0
noise_sigma = 0.05
motor_filter_tau = 3.0

[logging]
event_log = false
trace_every_ticks = 10
full_trace_lifetimes = 0
record_raw_and_applied_updates = true

[seeds]
root_seed = 1
namespace = "development"
outer_seed = 1
