# `episodic_stationary` diagnostic profile (M3-04)
#
# Explicitly episodic clean-learning diagnostic: two unknown cue-action
# mappings, zero noise, no reversals, no blank gap, short delay, with
# agent state/traces reset at each rollout boundary, no trace decay
# (`no_decay_diagnostic`, lambda = 1.0), and one terminal update per
# rollout. This is a mathematical/learning diagnostic, NOT the main
# continuous condition (`debug_stationary` + `birth_only` + `persistent`
# owns that; M4 removes the resets).
#
# Run through the library episodic runner (`src/experiments/episodic.rs`),
# not through `simulate --baseline`. Baseline (B0/B1/O1) and B3 guards
# reject this profile because `reset_policy` is `episodic_diagnostic`.
# Resolved configs and runner summaries carry `reset_policy`,
# `trace_policy`, mode `episodic_diagnostic`, and per-rollout reset ticks
# so a diagnostic run cannot masquerade as a continuous result.

schema_version = 1
profile_name = "episodic_stationary"

[simulation]
dt = 1.0
precision = "f64"
warmup_ticks = 0
outcomes_per_lifetime = 50
reset_policy = "episodic_diagnostic"
feedback_order = "before_neural_transition"

[environment]
kind = "stationary_clean"
cue_count = 2
cue_encoding = "one_hot"
stable_fraction = 1.0
feedback_noise_values = [0.0]
volatile_hazard_values = [0.0]
hazard_clock = "cue_exposure"
quiet_ticks = [4, 4]
cue_ticks = 8
memory_gap_ticks = [0, 0]
response_ticks = 4
reward_delay_ticks = [1, 1]
feedback_ticks = 1
max_pending_choices = 1

[actor]
neuron_count = 16
motor_neurons_per_action = 2
edge_probability = 0.25
self_edges = false
recurrent_gain = 0.8
input_scale = 0.3
tau_h = 5.0
tau_a = 100.0
adaptation_strength = 0.0
noise_sigma = 0.05
motor_filter_tau = 3.0

[learning]
enabled = true
rule = "gaussian_transition_score"
plastic_mask = "motor_afferent_only"
trace_policy = "no_decay_diagnostic"
tau_e = 32.0
eta = 0.001
max_update = 0.01
plastic_bound = 0.5
plastic_decay = 0.0
reward_baseline_initial = 0.5
reward_baseline_beta = 0.02

[modulator]
mode = "fixed"
neuron_count = 2
tau_m = 20.0
ordinary_feedback_to_actor = false
gate_timing = "pre_outcome"
gate_bias_initial = 0.0
projection_init_std = 0.01

[evolution]
enabled = false
population_size = 32
elite_count = 8
mutation_std = 0.1
search_space = "gate_projection_only"

[logging]
event_log = true
trace_every_ticks = 10
full_trace_lifetimes = 1
record_raw_and_applied_updates = true

[seeds]
root_seed = 1
namespace = "development"
outer_seed = 1
