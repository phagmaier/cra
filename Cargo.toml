[package]
name = "cra"
version = "0.1.0"
edition = "2024"

[lib]
name = "cra"
path = "src/lib.rs"

[[bin]]
name = "cra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: correctly-rounded JSON float parsing, required for
# bitwise checkpoint replay (M1-09). The default parser mis-rounds rare
# decimals by 1 ulp, which silently corrupts weights across save/load.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
thiserror = "2.0"
rand = "0.9"
rand_chacha = "0.9"
rand_core = "0.9"
sha2 = "0.10"
