[package]
name = "cra"
version = "0.1.0"
edition = "2024"

[lib]
name = "cra"
path = "src/lib.rs"

[[bin]]
name = "cra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
rand = "0.9"
rand_chacha = "0.9"
rand_core = "0.9"
sha2 = "0.10"
